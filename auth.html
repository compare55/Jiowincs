<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiowin Login / Register</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="card"><a class="back" href="/">← Back to Jiowin</a><h1>Jiowin Account</h1><p class="sub">Login or create an account. No OTP required.</p><div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="registerTab" type="button">Register</button></div>
<form id="authForm"><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" autocomplete="username" required placeholder="3–24 letters, numbers, _"><div id="phoneWrap" class="hidden"><label for="phone">Phone (optional)</label><input id="phone" name="phone" maxlength="24" autocomplete="tel" placeholder="Phone number"></div><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required placeholder="At least 8 characters"><button id="submitBtn" class="submit" type="submit">Login</button><p id="message" role="status"></p></form><p id="loggedIn" class="hidden"></p><button id="logoutBtn" class="logout hidden" type="button">Logout</button><p class="note">Never share your password. Jiowin notifications do not include passwords.</p></main><script src="auth.js"></script></body></html>
